fsdp:
  enabled: true
  reshard_after_forward: true
  shard_language_layers: true
  shard_vision_blocks: true
  mixed_precision: true
  param_dtype: "bfloat16"
  reduce_dtype: "float32"
  output_dtype: null
  cpu_offload: false
  cpu_offload_pin_memory: true

training:
  num_epochs: 3

  learning_rate: 2.0e-5
  weight_decay: 0.01

  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

  gradient_accumulation_steps: 4

  max_grad_norm: 1.0

  scheduler_type: cosine

  warmup_ratio: 0.03
  warmup_steps: null

  log_every_steps: 10

checkpoint:
  enabled: true
  directory: "./results/checkpoints"

  # Optimizer steps, NOT microbatches.
  save_every_steps: 500
  save_at_epoch_end: true
  keep_last_n: 1

  # null    -> start from pretrained model
  # latest  -> automatically resume latest checkpoint
  # /path   -> resume a specific checkpoint
  resume_from: null
