dataset:
  path: "trl-lib/llava-instruct-mix"
  split: "train"
  cache_dir: "/data/gpfs/projects/punim2030/huggingface/cache"        # point at scratch/gpfs, not $HOME (quota)
  image_root: null
  max_length: 4096
  adapter: 'llava_instruct'

dataloader:
  batch_size: 2
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  drop_last: true
